<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Micro Apps</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --bg: #f5efe6; --card: #fffaf3; --ink: #2b1f18; --ink-2: #6b5a4e; --line: #e2d6c5; --accent: #b4572e; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #15100d; --card: #211913; --ink: #f2e7da; --ink-2: #bfae9c; --line: #33281f; --accent: #e3895a; }
  }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 Inter, system-ui, sans-serif; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 56px 16px; }
  h1 { font-family: Fraunces, Georgia, serif; font-weight: 300; font-size: 48px; margin: 0 0 24px; }
  a.app { display: block; padding: 18px 20px; border: 1px solid var(--line); border-radius: 16px; background: var(--card); color: inherit; text-decoration: none; transition: border-color .2s; }
  a.app:hover { border-color: var(--accent); }
  a.app b { font-family: Fraunces, Georgia, serif; font-weight: 400; font-size: 22px; display: block; }
  a.app span { color: var(--ink-2); }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Micro apps</h1>
    <a class="app" href="pour-over/"><b>The V60</b><span>Guided brew timer for James Hoffmann’s V60 recipes.</span></a>
  </div>
</body>
</html>
